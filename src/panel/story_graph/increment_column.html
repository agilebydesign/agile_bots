<!-- Increment Column - Individual increment column container -->
<div class="increment-column-container" data-inc="${escapedName}" data-behavior-needed="${behaviorNeeded}" data-collapsed="false" onclick="event.stopPropagation(); selectIncrement(this.getAttribute('data-inc'), this.getAttribute('data-behavior-needed'));">
    <div class="increment-column-header">
        <button class="increment-collapse-button" onclick="event.stopPropagation(); toggleIncrementCollapse(this.closest('.increment-column-container'))" title="Collapse / expand increment column" aria-label="Collapse / expand increment column"><img src="${incrementCollapseIconPath}" class="increment-header-icon" alt="" /></button>
        <span class="increment-drag-handle" draggable="true" data-inc="${escapedName}" title="Drag to reorder">⠿</span>
        <span
            class="increment-name"
            contenteditable="true"
            data-increment-name="${escapedName}"
            onclick="event.stopPropagation();"
            onblur="renameIncrement(this, this.getAttribute('data-increment-name'))"
            onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();} if(event.key==='Escape'){this.innerText=this.getAttribute('data-increment-name');this.blur();}"
            title="Click to rename"
        >${escapedName}</span>
        <button class="increment-delete-button" data-inc="${escapedName}" onclick="event.stopPropagation(); deleteIncrement(this.getAttribute('data-inc'))" title="Delete increment" aria-label="Delete increment"><svg class="increment-delete-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M10 11v6M14 11v6M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2M6 7l1 14h10l1-14"/></svg></button>
    </div>
    <div class="increment-stories-body">
        ${sortedStoryNames}
    </div>
</div>
